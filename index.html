<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <script src="./script.js" defer></script>
    <div class = "superContainer">
        <div class = "container">
            <div class="display"></div>
            <div class="container1">
                <button class="clear" data-key="Backspace">AC</button>
                <button class="percent" data-key="%">%</button>
                <button class="operator" data-key="*">*</button>
                <button class="delete" data-key="D">C</button>
            </div>
            <div class = "container2">
                <button class="operand" data-key="7">7</button>
                <button class="operand" data-key="8">8</button>
                <button class="operand" data-key="9">9</button>
                <button class="operator" id="right" data-key="/">÷</button>
            </div>
            <div class = "container3">
                <button class="operand" data-key="4">4</button>
                <button class="operand" data-key="5">5</button>
                <button class="operand" data-key="6">6</button>
                <button class="operator" id="right" data-key="-">-</button>
            </div>
            <div class = "container4">
                <button class="operand" data-key="1">1</button>
                <button class="operand" data-key="2">2</button>
                <button class="operand" data-key="3">3</button>
                <button class="operator" id="right" data-key="+">+</button>
            </div>
            <div class="container5">
                <button class="plus/minus" data-key="N">+/-</button>
                <button class="operand" data-key="0">0</button>
                <button class="dot" data-key=".">.</button>
                <button class="operator" id="right" data-key="=">=</button>
            </div>
        </div>
    </div>
</body>
</html>
